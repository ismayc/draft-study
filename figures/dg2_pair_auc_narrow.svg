<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 360 614.45" role="img" aria-label="What a test AUC means, counted pair by pair"><title>What a test AUC means, counted pair by pair</title><defs><marker id="dg-arrow-c4924ee97b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="12" y="28" font-size="17" class="dg-f-ink dg-display" font-weight="600">Pair every held-out player who</text><text x="12" y="50.95" font-size="17" class="dg-f-ink dg-display" font-weight="600">reached a rotation (105) with every</text><text x="12" y="73.9" font-size="17" class="dg-f-ink dg-display" font-weight="600">one who did not (87)</text><text x="12" y="97.9" font-size="13" class="dg-f-ink2 dg-text">9,135 pairs. For each, ask: was the player who</text><text x="12" y="115.45" font-size="13" class="dg-f-ink2 dg-text">made it picked earlier?</text><rect x="12" y="137.45" width="336" height="108" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><text x="24" y="161.45" font-size="12" class="dg-f-nba dg-text" font-weight="700">For example: earlier pick made it</text><text x="24" y="185.45" font-size="12" class="dg-f-ink dg-text">#1 Zion Williamson (2019): made a rotation</text><text x="24" y="202.85" font-size="12" class="dg-f-ink dg-text">#60 Sam Merrill (2020): did not</text><text x="24" y="233.45" font-size="12" class="dg-f-ink3 dg-text" font-style="italic">counts as right</text><rect x="12" y="255.45" width="336" height="108" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><text x="24" y="279.45" font-size="12" class="dg-f-c8 dg-text" font-weight="700">For example: later pick made it</text><text x="24" y="303.45" font-size="12" class="dg-f-ink dg-text">#2 James Wiseman (2020): did not</text><text x="24" y="320.85" font-size="12" class="dg-f-ink dg-text">#57 Jabari Walker (2022): made a rotation</text><text x="24" y="351.45" font-size="12" class="dg-f-ink3 dg-text" font-style="italic">counts as wrong</text><text x="12" y="399.45" font-size="13" class="dg-f-ink dg-text" font-weight="700">All held-out pairs</text><rect x="12" y="411.45" width="277.149" height="30" class="dg-f-nba" opacity="1.0"/><rect x="289.149" y="411.45" width="2.94253" height="30" class="dg-f-ink3" opacity="0.5"/><rect x="292.092" y="411.45" width="55.908" height="30" class="dg-f-c8" opacity="0.85"/><text x="12" y="463.45" font-size="12" class="dg-f-nba dg-text" font-weight="600">earlier pick made it: 7,535</text><text x="12" y="481.45" font-size="12" class="dg-f-ink2 dg-text" font-weight="600">same pick slot, different years: 80</text><text x="12" y="499.45" font-size="12" class="dg-f-c8 dg-text" font-weight="600">later pick made it: 1,520</text><text x="12" y="529.45" font-size="13" class="dg-f-ink2 dg-text">AUC = (right + half the ties) / all pairs</text><text x="12" y="556.25" font-size="18" class="dg-f-nba dg-text" font-weight="700">(7,535 + 80 / 2) / 9,135 = 0.829</text><text x="12" y="582.25" font-size="12" class="dg-f-ink3 dg-text" font-style="italic">Ranking players at random would get half the pairs</text><text x="12" y="598.45" font-size="12" class="dg-f-ink3 dg-text" font-style="italic">right.</text></svg>
