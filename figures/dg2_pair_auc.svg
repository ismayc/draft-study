<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 436.6" role="img" aria-label="What a test AUC means, counted pair by pair"><title>What a test AUC means, counted pair by pair</title><defs><marker id="dg-arrow-5417c84f77" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="12" y="28" font-size="20" class="dg-f-ink dg-display" font-weight="600">Pair every held-out player who reached a rotation (105) with every</text><text x="12" y="55" font-size="20" class="dg-f-ink dg-display" font-weight="600">one who did not (87)</text><text x="12" y="79" font-size="16" class="dg-f-ink2 dg-text">9,135 pairs. For each, ask: was the player who made it picked earlier?</text><rect x="12" y="101" width="362" height="108" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><text x="24" y="125" font-size="14" class="dg-f-nba dg-text" font-weight="700">For example: earlier pick made it</text><text x="24" y="149" font-size="14" class="dg-f-ink dg-text">#1 Zion Williamson (2019): made a rotation</text><text x="24" y="169.3" font-size="14" class="dg-f-ink dg-text">#60 Sam Merrill (2020): did not</text><text x="24" y="197" font-size="14" class="dg-f-ink3 dg-text" font-style="italic">counts as right</text><rect x="386" y="101" width="362" height="108" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><text x="398" y="125" font-size="14" class="dg-f-c8 dg-text" font-weight="700">For example: later pick made it</text><text x="398" y="149" font-size="14" class="dg-f-ink dg-text">#2 James Wiseman (2020): did not</text><text x="398" y="169.3" font-size="14" class="dg-f-ink dg-text">#57 Jabari Walker (2022): made a rotation</text><text x="398" y="197" font-size="14" class="dg-f-ink3 dg-text" font-style="italic">counts as wrong</text><text x="12" y="245" font-size="16" class="dg-f-ink dg-text" font-weight="700">All held-out pairs</text><rect x="12" y="257" width="607.089" height="30" class="dg-f-nba" opacity="1.0"/><rect x="619.089" y="257" width="6.44554" height="30" class="dg-f-ink3" opacity="0.5"/><rect x="625.535" y="257" width="122.465" height="30" class="dg-f-c8" opacity="0.85"/><text x="12" y="309" font-size="14" class="dg-f-nba dg-text" font-weight="600">earlier pick made it: 7,535</text><text x="748" y="309" font-size="14" class="dg-f-c8 dg-text" text-anchor="end" font-weight="600">later pick made it: 1,520</text><text x="12" y="329" font-size="14" class="dg-f-ink2 dg-text">same pick slot, different years: 80</text><text x="12" y="363" font-size="16" class="dg-f-ink2 dg-text">AUC = (right + half the ties) / all pairs</text><text x="12" y="394.6" font-size="21" class="dg-f-nba dg-text" font-weight="700">(7,535 + 80 / 2) / 9,135 = 0.829</text><text x="12" y="420.6" font-size="14" class="dg-f-ink3 dg-text" font-style="italic">Ranking players at random would get half the pairs right.</text></svg>
