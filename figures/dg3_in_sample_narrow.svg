<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 360 620.55" role="img" aria-label="The college features help in sample and add nothing out of era"><title>The college features help in sample and add nothing out of era</title><defs><marker id="dg-arrow-d5accb59e9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="12" y="28" font-size="17" class="dg-f-ink dg-display" font-weight="600">Two models, scored where they were</text><text x="12" y="50.95" font-size="17" class="dg-f-ink dg-display" font-weight="600">fit and on the held-out classes</text><text x="124" y="80.95" font-size="13" class="dg-f-ink dg-text" text-anchor="middle" font-weight="700">In sample</text><text x="124" y="96.55" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle">2011-2018</text><text x="284" y="80.95" font-size="13" class="dg-f-ink dg-text" text-anchor="middle" font-weight="700">Out of era</text><text x="284" y="96.55" font-size="12" class="dg-f-ink3 dg-text" text-anchor="middle">2019-2022</text><line x1="124" y1="130.95" x2="124" y2="340.95" stroke-width="1.5" class="dg-s-rule"/><line x1="284" y1="130.95" x2="284" y2="340.95" stroke-width="1.5" class="dg-s-rule"/><line x1="124" y1="236.371" x2="284" y2="309.482" stroke-width="3" class="dg-s-ink2"/><circle cx="124" cy="236.371" r="5" class="dg-f-ink2"/><circle cx="284" cy="309.482" r="5" class="dg-f-ink2"/><text x="114" y="241.371" font-size="13" class="dg-f-ink2 dg-text" text-anchor="end" font-weight="700">0.844</text><text x="114" y="258.271" font-size="12" class="dg-f-ink2 dg-text" text-anchor="end">pick only</text><line x1="124" y1="150.502" x2="284" y2="311.622" stroke-width="3" class="dg-s-nba"/><circle cx="124" cy="150.502" r="5" class="dg-f-nba"/><circle cx="284" cy="311.622" r="5" class="dg-f-nba"/><text x="114" y="155.502" font-size="13" class="dg-f-nba dg-text" text-anchor="end" font-weight="700">0.862</text><text x="114" y="138.602" font-size="12" class="dg-f-nba dg-text" text-anchor="end">pick + college</text><text x="294" y="307.482" font-size="13" class="dg-f-ink2 dg-text" font-weight="700">0.829</text><text x="294" y="325.082" font-size="13" class="dg-f-nba dg-text" font-weight="700">0.829</text><rect x="12" y="370.95" width="336" height="233.6" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><text x="26" y="400.95" font-size="13" class="dg-f-ink dg-text" font-weight="700">What the college stats add</text><text x="26" y="434.95" font-size="30" class="dg-f-ink2 dg-display" font-weight="700">+0.018</text><text x="118" y="434.95" font-size="12" class="dg-f-ink2 dg-text">in sample</text><text x="26" y="472.95" font-size="30" class="dg-f-nba dg-display" font-weight="700">0.000</text><text x="118" y="472.95" font-size="12" class="dg-f-ink2 dg-text">out of era</text><text x="26" y="504.95" font-size="12" class="dg-f-ink2 dg-text" font-weight="600">The 15 college features:</text><text x="26" y="521.75" font-size="12" class="dg-f-ink3 dg-text">age at draft, height, offensive BPM, defensive</text><text x="26" y="537.95" font-size="12" class="dg-f-ink3 dg-text">BPM, usage rate, true shooting, offensive</text><text x="26" y="554.15" font-size="12" class="dg-f-ink3 dg-text">rebounding, defensive rebounding, assist rate,</text><text x="26" y="570.35" font-size="12" class="dg-f-ink3 dg-text">turnover rate, block rate, steal rate, threes</text><text x="26" y="586.55" font-size="12" class="dg-f-ink3 dg-text">attempted, free-throw rate, college class</text></svg>
